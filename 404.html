        <h1>De Bijbel Online — De Heilige Schrift &amp; Bijbelteksten (The Bible Online)</h1>
        <p>Schakel JavaScript in om de interactieve 3D Bijbel te verkennen op <a href="https://de3dbijbel.nl/">de3dbijbel.nl</a>. De 3D Bijbel is een gratis, interactief platform waarop je Bijbelse bouwwerken en heiligdommen in 3D bekijkt, terwijl je de bijbehorende Bijbelteksten leest in de Statenvertaling en de King James Bible.</p>

        <h2>Bijbelse bouwwerken in 3D</h2>
        <ul>
          <li><strong>Het Hof van Eden en de Zondeval</strong> — de hof van Eden en de verzoeking van Adam en Eva in 3D, naar Genesis 2-3.</li>
          <li><strong>De Ark van Noach</strong> — de bouw van de ark en de zondvloed in 3D, naar Genesis 6-9.</li>
          <li><strong>De Toren van Babel</strong> — de stad en toren van Babel in 3D, naar Genesis 11.</li>
          <li><strong>De Doortocht door de Rode Zee</strong> — de doortocht van Israël door de Rode Zee in 3D, naar Exodus 14.</li>
          <li><strong>De Tabernakel in de Woestijn</strong> — de tabernakel van Mozes met de ark des verbonds in 3D, naar Exodus 25-40.</li>
          <li><strong>De Muren van Jericho</strong> — de ommuurde stad Jericho in 3D, naar Jozua 6.</li>
          <li><strong>De Tempel van Salomo</strong> — Salomo's tempel te Jeruzalem in 3D, naar 1 Koningen 6-7.</li>
          <li><strong>De Tweede Tempel te Jeruzalem</strong> — de tempel van Herodes in 3D, naar Markus 13 en Mattheüs 27.</li>
          <li><strong>De Olijfberg en Gethsémané</strong> — de Olijfberg en de hof van Gethsémané in 3D, naar Mattheüs 26 en Handelingen 1.</li>
          <li><strong>Golgotha en de Kruisiging</strong> — Golgotha in 3D, naar Johannes 19 en Lukas 23.</li>
          <li><strong>Het Nieuwe Jeruzalem</strong> — de heilige stad in 3D, naar Openbaring 21-22.</li>
        </ul>

        <p>Deze 3D Bijbel is onderdeel van <a href="https://desamenkomst.nl/">De Samenkomst</a> en is beschikbaar in het Nederlands (<a href="https://de3dbijbel.nl/">de3dbijbel.nl</a>) en in het Engels (<a href="https://de3dbijbel.nl/?lang=en">de3dbijbel.nl/?lang=en</a>).</p>
