<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bijbel — De 3D Bijbel</title>
<meta name="description" content="Lees de Bijbel in de Statenvertaling, Herziene Statenvertaling, NBG 1951 en King James Version, bij De 3D Bijbel." />
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#3C5E70" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#f4f6f7;--paper-deep:#eaeef0;--surface:#fff;--ink:#1d2b33;--ink-soft:#3C5E70;--ink-muted:#9aa7af;--accent:#3C5E70;--accent-deep:#2c4757;--line:#d2d9dd;--jesus:#b4412f;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  header a.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:.85rem;font-weight:600;border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:7px 11px;white-space:nowrap}
  header h1{font-family:"DM Sans",system-ui,sans-serif;font-size:1.05rem;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;color:#fff;border:0;padding:7px 10px;font:600 .78rem Inter,system-ui,sans-serif;cursor:pointer}
  .seg button[aria-pressed=true]{background:#fff;color:var(--accent)}
  .layout{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:20px;padding:18px 14px 70px}
  aside{background:var(--surface);border:1px solid rgba(29,43,51,.1);border-radius:14px;padding:14px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
  aside h2{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:14px 0 8px}
  aside h2:first-child{margin-top:0}
  .books{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .books button,.chs button{background:var(--paper-deep);color:var(--ink);border:0;border-radius:10px;padding:8px 9px;font:500 .8rem Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
  .books button[aria-current=true],.chs button[aria-current=true]{background:var(--accent);color:#fff}
  .chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
  .chs button{text-align:center;padding:8px 0}
  main{background:var(--surface);border:1px solid rgba(29,43,51,.1);border-radius:14px;padding:22px 22px 28px;min-width:0}
  main .crumb{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
  main h2{font-family:"DM Sans",system-ui,sans-serif;font-size:1.7rem;margin:.2rem 0 1rem}
  .text{font-size:1.06rem;line-height:1.85}
  .text .heading{font-family:"DM Sans",system-ui,sans-serif;font-weight:700;font-size:1.02rem;color:var(--accent);margin:1.4rem 0 .3rem}
  .text .v{margin:.15rem 0;border-radius:6px;padding:.05rem .25rem}
  .text .v.hl{background:#fef9c3}
  .text sup{font-size:.66rem;font-weight:700;color:var(--accent);margin-right:.25em;vertical-align:super}
  .text .j{color:var(--jesus)}
  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .pager button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 .85rem Inter,system-ui,sans-serif;cursor:pointer}
  .pager button[disabled]{background:var(--paper-deep);color:var(--ink-muted);cursor:default}
  .status{color:var(--ink-soft);padding:14px 0}
  .toggle{display:none;width:100%;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:600 .9rem Inter,system-ui,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:12px 10px 60px}
    .toggle{display:block}
    aside{position:static;max-height:none;display:none}
    aside.open{display:block}
    main{padding:16px 14px 22px}
    main h2{font-size:1.4rem}
    header h1{font-size:.98rem}
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/" id="back">&larr; <span id="t-back">3D Bijbel</span></a>
  <h1 id="t-title">Bijbel</h1>
  <div class="seg" id="vers" role="group" aria-label="Vertaling"></div>
  <div class="seg" id="lang" role="group" aria-label="Taal"><button data-l="nl">NL</button><button data-l="en">EN</button></div>
</header>
<div class="layout">
  <aside id="side">
    <h2 id="t-ot"></h2><div class="books" id="ot"></div>
    <h2 id="t-nt"></h2><div class="books" id="nt"></div>
    <h2 id="t-ch"></h2><div class="chs" id="chs"></div>
  </aside>
  <div>
    <button class="toggle" id="toggle" type="button"></button>
    <main id="main"><div class="status" id="status"></div></main>
  </div>
</div>
<script type="module">
const VERSIONS = { sv: 'SV', hsv: 'HSV', nbg51: 'NBG', kjv: 'KJV' };
const NAMES = {
  nl: { sv: 'Statenvertaling', hsv: 'Herziene Statenvertaling', nbg51: 'NBG-vertaling 1951', kjv: 'King James Version' },
  en: { sv: 'Statenvertaling (Dutch)', hsv: 'Herziene Statenvertaling (Dutch)', nbg51: 'NBG 1951 (Dutch)', kjv: 'King James Version' }
};
const T = {
  nl: { back: '3D Bijbel', title: 'Bijbel', ot: 'Oude Testament', nt: 'Nieuwe Testament', ch: 'Hoofdstuk', loading: 'Bijbel laden…', error: 'De Bijbel kon niet worden geladen. Controleer je verbinding en probeer het opnieuw.', prev: '← Vorige', next: 'Volgende →', pick: 'Kies boek en hoofdstuk', chapter: 'Hoofdstuk', doc: 'Bijbel — De 3D Bijbel' },
  en: { back: '3D Bible', title: 'Bible', ot: 'Old Testament', nt: 'New Testament', ch: 'Chapter', loading: 'Loading the Bible…', error: 'The Bible could not be loaded. Check your connection and try again.', prev: '← Previous', next: 'Next →', pick: 'Choose book and chapter', chapter: 'Chapter', doc: 'Bible — The 3D Bible' }
};
const NT_START = 'MAT';
try { history.scrollRestoration = 'manual'; } catch (e) {}
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);

function readLocale() {
  const q = qs.get('lang') || qs.get('locale');
  if (q === 'en' || q === 'nl') return q;
  try { const s = localStorage.getItem('bible-locale'); if (s === 'en' || s === 'nl') return s; } catch (e) {}
  return 'nl';
}
let locale = readLocale();
let version = VERSIONS[qs.get('v')] ? qs.get('v') : (locale === 'en' ? 'kjv' : 'sv');
const cache = {};
let books = null;
let bookIdx = 0, chapter = 1, hlStart = 0, hlEnd = 0;

function parseRef(ref) {
  const m = /^([1-3A-Za-z]{2,4})\.(\d+)(?:\.(\d+)(?:-(\d+))?)?$/.exec(ref || '');
  return m ? { code: m[1].toUpperCase(), ch: +m[2], v1: m[3] ? +m[3] : 0, v2: m[4] ? +m[4] : (m[3] ? +m[3] : 0) } : null;
}
async function load(v) {
  if (cache[v]) return cache[v];
  const mod = await import('/' + v + '.js');
  cache[v] = mod.default;
  return cache[v];
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function drawStatic() {
  const t = T[locale];
  document.documentElement.lang = locale;
  document.title = t.doc;
  $('t-back').textContent = t.back; $('t-title').textContent = t.title;
  $('t-ot').textContent = t.ot; $('t-nt').textContent = t.nt; $('t-ch').textContent = t.ch;
  $('toggle').textContent = t.pick;
  $('vers').innerHTML = Object.keys(VERSIONS).map((k) => '<button data-v="' + k + '" aria-pressed="' + (k === version) + '" title="' + esc(NAMES[locale][k]) + '">' + VERSIONS[k] + '</button>').join('');
  $('lang').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === locale)));
}
function drawBooks() {
  if (!books) return;
  const mk = (b, i) => '<button data-b="' + i + '"' + (i === bookIdx ? ' aria-current="true"' : '') + '>' + esc(b.name) + '</button>';
  const ntAt = books.findIndex((b) => b.code === NT_START);
  $('ot').innerHTML = books.slice(0, ntAt).map((b, i) => mk(b, i)).join('');
  $('nt').innerHTML = books.slice(ntAt).map((b, i) => mk(b, i + ntAt)).join('');
  drawChapters();
}
function drawChapters() {
  const n = books[bookIdx].chapters.length;
  $('chs').innerHTML = Array.from({ length: n }, (_, i) => '<button data-c="' + (i + 1) + '"' + (i + 1 === chapter ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>').join('');
}
// Red letters are intentionally not shown: the Bible data bundled with the 3D app has an older red-letter layer (SV only; e.g. John 3:16-21 wrongly red).
function wordsHtml(text, ranges) {
  if (!ranges || !ranges.length) return esc(text);
  const w = text.split(' ');
  return w.map((word, i) => ranges.some((r) => i >= r[0] && i <= r[1]) ? '<span class="j">' + esc(word) + '</span>' : esc(word)).join(' ');
}
function drawChapter() {
  const b = books[bookIdx], c = b.chapters[chapter - 1], t = T[locale];
  const verses = c.v || [], heads = c.h || {}, jj = c.j || [];
  let html = '<div class="crumb">' + esc(NAMES[locale][version]) + '</div><h2>' + esc(b.name) + ' ' + chapter + '</h2><div class="text">';
  verses.forEach((txt, i) => {
    if (heads[String(i)]) html += '<div class="heading">' + esc(heads[String(i)]) + '</div>';
    const on = hlStart && i + 1 >= hlStart && i + 1 <= hlEnd;
    html += '<p class="v' + (on ? ' hl' : '') + '" id="v' + (i + 1) + '"><sup>' + (i + 1) + '</sup>' + esc(txt) + '</p>';
  });
  const first = bookIdx === 0 && chapter === 1, last = bookIdx === books.length - 1 && chapter === b.chapters.length;
  html += '</div><div class="pager"><button id="prev"' + (first ? ' disabled' : '') + '>' + t.prev + '</button><button id="next"' + (last ? ' disabled' : '') + '>' + t.next + '</button></div>';
  $('main').innerHTML = html;
  drawChapters();
  document.querySelectorAll('#ot button,#nt button').forEach((x) => x.removeAttribute('aria-current'));
  const cur = document.querySelector('[data-b="' + bookIdx + '"]'); if (cur) cur.setAttribute('aria-current', 'true');
  const u = new URL(location.href);
  u.search = '';
  u.searchParams.set('v', version);
  u.searchParams.set('ref', b.code + '.' + chapter + (hlStart ? '.' + hlStart + (hlEnd > hlStart ? '-' + hlEnd : '') : ''));
  if (locale === 'en') u.searchParams.set('lang', 'en');
  history.replaceState(null, '', u);
  const go = () => { if (hlStart && $('v' + hlStart)) $('v' + hlStart).scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0); };
  go(); requestAnimationFrame(go); setTimeout(go, 400); // again after layout/fonts, so a restored scroll position never wins
}
async function show(startRef) {
  $('main').innerHTML = '<div class="status">' + T[locale].loading + '</div>';
  try {
    books = await load(version);
  } catch (e) {
    $('main').innerHTML = '<div class="status">' + T[locale].error + '</div>';
    return;
  }
  if (startRef) {
    const i = books.findIndex((b) => b.code === startRef.code);
    bookIdx = i >= 0 ? i : 0;
    chapter = Math.min(Math.max(startRef.ch, 1), books[bookIdx].chapters.length);
    hlStart = startRef.v1; hlEnd = startRef.v2;
  } else {
    bookIdx = Math.min(bookIdx, books.length - 1);
    chapter = Math.min(chapter, books[bookIdx].chapters.length);
  }
  drawBooks();
  drawChapter();
}
// events
document.addEventListener('click', (e) => {
  const el = e.target.closest('button'); if (!el) return;
  if (el.dataset.v) { version = el.dataset.v; drawStatic(); show(null); return; }
  if (el.dataset.l) { locale = el.dataset.l; try { localStorage.setItem('bible-locale', locale); } catch (x) {} drawStatic(); if (books) drawChapter(); return; }
  if (el.dataset.b !== undefined) { bookIdx = +el.dataset.b; chapter = 1; hlStart = hlEnd = 0; drawChapters(); drawChapter(); document.querySelectorAll('#ot button,#nt button').forEach((x) => x.removeAttribute('aria-current')); el.setAttribute('aria-current', 'true'); return; }
  if (el.dataset.c) { chapter = +el.dataset.c; hlStart = hlEnd = 0; drawChapter(); $('side').classList.remove('open'); return; }
  if (el.id === 'prev' || el.id === 'next') {
    hlStart = hlEnd = 0;
    if (el.id === 'next') { if (chapter < books[bookIdx].chapters.length) chapter++; else if (bookIdx < books.length - 1) { bookIdx++; chapter = 1; } }
    else { if (chapter > 1) chapter--; else if (bookIdx > 0) { bookIdx--; chapter = books[bookIdx].chapters.length; } }
    drawBooks(); drawChapter(); return;
  }
  if (el.id === 'toggle') $('side').classList.toggle('open');
});
drawStatic();
show(parseRef(qs.get('ref')) || { code: 'GEN', ch: 1, v1: 0, v2: 0 });
</script>
</body>
</html>
